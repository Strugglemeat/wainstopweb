<html>
<head>
    <title>WAINSTOP ENTERPRISES</title>
    <style>
        /* ── Reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 2rem 1rem;
            margin: 0;
        }

        /* ── Top middle image ── */
        .top-img {
            display: block;
            height: auto;
            /* natural size, only capped so it never overflows small screens */
            max-width: min(90vw, 600px);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.06));
            transition: transform 0.4s ease, filter 0.4s ease;
            user-select: none;
        }

        .top-img:hover {
            transform: scale(1.03);
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.14));
        }

        /* ── Content row (side imgs + card) ── */
        .content-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            justify-items: center;
            width: 100%;
        }

        /* ── Side images ── */
        .side-img {
            width: 140px;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.05));
            transition: transform 0.4s ease, filter 0.4s ease;
            user-select: none;
        }

        .side-img:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.12));
        }

        /* ── Main card ── */
        .card {
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 3rem;
            padding: 3rem 2.5rem 2.5rem;
            width: 720px;
            max-width: 100%;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            text-align: center;
            transition: box-shadow 0.4s ease;
        }

        .card:hover {
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        /* ── Logo ── */
        .logo-link {
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                filter 0.4s ease;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.03));
        }

        .logo-link:hover {
            transform: scale(1.04) rotate(-1deg);
            filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.08));
        }

        .logo-link img {
            display: block;
            width: 180px;
            height: auto;
            margin: 0 auto 0.5rem;
            border-radius: 2rem;
            transition: all 0.3s ease;
        }

        /* ── Video wrapper ── */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            /* 16:9 */
            margin: 1.8rem 0 2.2rem;
            border-radius: 1.8rem;
            overflow: hidden;
            box-shadow:
                0 8px 40px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: box-shadow 0.4s ease;
        }

        .video-wrapper:hover {
            box-shadow:
                0 12px 56px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* ── Links ── */
        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem 1.2rem;
            margin-top: 1.2rem;
        }

        .links a {
            display: inline-block;
            padding: 0.55rem 1.6rem;
            border-radius: 100px;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .links a:active {
            transform: scale(0.96);
        }

        /* ── Subtle platform colors on hover ── */
        .links a[href*="youtube"]:hover {
            background: rgba(255, 0, 0, 0.15);
            border-color: rgba(255, 0, 0, 0.25);
            box-shadow: 0 8px 28px rgba(255, 0, 0, 0.12);
        }

        .links a[href*="twitter"]:hover,
        .links a[href*="x.com"]:hover {
            background: rgba(29, 161, 242, 0.12);
            border-color: rgba(29, 161, 242, 0.20);
            box-shadow: 0 8px 28px rgba(29, 161, 242, 0.08);
        }

        .links a[href*="steam"]:hover {
            background: rgba(23, 130, 230, 0.12);
            border-color: rgba(23, 130, 230, 0.20);
            box-shadow: 0 8px 28px rgba(23, 130, 230, 0.08);
        }

        /* ── Decorative glow ── */
        .glow {
            position: fixed;
            top: -30%;
            left: -30%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle at 30% 40%, rgba(120, 80, 255, 
0.06), transparent 70%);
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
            filter: blur(80px);
        }

        .glow-2 {
            position: fixed;
            bottom: -20%;
            right: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle at 70% 60%, rgba(255, 60, 120, 
0.05), transparent 70%);
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
            filter: blur(80px);
        }

        /* ── Responsive ── */
        @media (max-width: 1100px) {
            .side-img {
                display: none;
            }
            .content-row {
                grid-template-columns: 1fr;
            }
            .card {
                width: 100%;
                max-width: 720px;
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 2rem 1.2rem 1.8rem;
                border-radius: 2rem;
            }

            .logo-link img {
                width: 120px;
            }

            .links a {
                padding: 0.45rem 1.2rem;
                font-size: 0.9rem;
            }

            .links {
                gap: 0.5rem 0.8rem;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 1.5rem 0.8rem 1.4rem;
                border-radius: 1.5rem;
            }

            .logo-link img {
                width: 100px;
            }

            .links a {
                padding: 0.35rem 1rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient glows -->
    <div class="glow"></div>
    <div class="glow-2"></div>

    <!-- Top middle image -->
    <img src="pls.png" alt="pls" class="top-img">

    <!-- ─── Content row ─── -->
    <div class="content-row">

        <!-- Left side image -->
        <img src="lailailai.png" alt="Lailailai" class="side-img left">

        <!-- ─── Main card ─── -->
        <div class="card">

            <!-- Logo -->
            <a class="logo-link" href="ws_pilotredsun.mp4">
                <img src="ws-logo.png" alt="Wainstop Enterprises">
            </a>

            <!-- YouTube embed -->
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/riV_yh6FvUg" 
title="YouTube video player" allow="accelerometer; autoplay; 
clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
allowfullscreen="">
            </iframe>
        </div>

        <!-- Links -->
        <div class="links">
            <a href="https://www.youtube.com/@Wainstop" target="_blank" 
rel="noopener">YouTube</a>
            <a href="https://x.com/Wainstop" target="_blank" 
rel="noopener">Twitter</a>
            <a href="https://store.steampowered.com/publisher/wainstop" 
target="_blank" rel="noopener">Steam</a>
            <a href="https://wainstop.itch.io/" target="_blank" 
rel="noopener">Itch.io</a>
            <a href="https://wainshop.xyz" target="_blank" 
rel="noopener">Shop</a>
        </div>

    </div>

    <!-- Right side image -->
    <img src="stefsymbol.png" alt="Stef symbol" class="side-img right">

    </div>

</body>
</html>
